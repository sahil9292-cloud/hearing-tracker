<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hearing Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1a1a2e;min-height:100vh;}
.app{max-width:500px;margin:0 auto;padding:1rem;}
.header{background:linear-gradient(135deg,#1565C0,#1976D2);color:white;border-radius:14px;padding:1.1rem 1.3rem;margin-bottom:1rem;box-shadow:0 4px 15px rgba(21,101,192,0.3);}
.header h1{font-size:19px;font-weight:700;}
.header p{font-size:11px;opacity:0.85;margin-top:2px;}
.sync-bar{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;}
.dot{width:8px;height:8px;border-radius:50%;background:#ff9800;}
.dot.ok{background:#69f0ae;}.dot.err{background:#ff5252;}
.tabs{display:flex;gap:6px;margin-bottom:1rem;}
.tab{flex:1;padding:9px 4px;border:1.5px solid #dce3ed;border-radius:10px;background:white;font-size:12px;font-weight:600;color:#888;cursor:pointer;}
.tab.active{background:#E3F2FD;color:#1565C0;border-color:#1565C0;}
.section{display:none;}.section.visible{display:block;}
.card{background:white;border-radius:14px;padding:1.2rem 1.3rem;box-shadow:0 1px 6px rgba(0,0,0,0.07);margin-bottom:0.8rem;}
.field{margin-bottom:0.9rem;}
.field label{display:block;font-size:11.5px;color:#555;margin-bottom:4px;font-weight:600;text-transform:uppercase;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid #e0e7ef;border-radius:9px;font-size:14px;background:white;color:#1a1a2e;}
.field input:focus,.field select:focus{outline:none;border-color:#1565C0;}
.field textarea{resize:vertical;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;margin-bottom:8px;}
.btn-blue{background:#1565C0;color:white;}.btn-green{background:#2e7d32;color:white;}
.btn-gray{background:#eef2f7;color:#444;}
.btn-row{display:flex;gap:8px;margin-bottom:8px;}.btn-row .btn{margin-bottom:0;}
.entry-card{background:white;border-radius:12px;padding:1rem 1.2rem;margin-bottom:0.7rem;box-shadow:0 1px 5px rgba(0,0,0,0.07);border-left:4px solid #1565C0;}
.entry-card.today{border-left-color:#d32f2f;background:#fff8f8;}
.entry-card.past{border-left-color:#bbb;opacity:0.85;}
.ec-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.ec-name{font-weight:700;font-size:15px;}
.uid-badge{font-size:10px;background:#E3F2FD;color:#1565C0;padding:3px 9px;border-radius:20px;font-weight:600;}
.ec-meta{font-size:12px;color:#777;margin-bottom:6px;}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;margin-right:4px;}
.b-blue{background:#E3F2FD;color:#1565C0;}.b-green{background:#E8F5E9;color:#2e7d32;}
.b-red{background:#FFEBEE;color:#c62828;}.b-orange{background:#FFF3E0;color:#e65100;}
.b-today{background:#d32f2f;color:white;}.b-tomorrow{background:#f57c00;color:white;}
.ec-gmail{font-size:11px;color:#999;margin-top:4px;}
.ec-actions{display:flex;gap:6px;margin-top:10px;}
.ec-btn{flex:1;padding:6px;font-size:12px;border-radius:8px;border:1.5px solid #e0e7ef;background:transparent;color:#555;cursor:pointer;}
.ec-btn.del{color:#c62828;border-color:#ffcdd2;}
.empty{text-align:center;color:#bbb;font-size:14px;padding:3rem 0;}
.filter-row{display:flex;gap:8px;margin-bottom:0.9rem;}
.filter-row select{flex:1;padding:8px 10px;font-size:12px;border:1.5px solid #e0e7ef;border-radius:9px;background:white;}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,0.2);}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚖️ Hearing Tracker</h1>
    <p>Notice management · GitHub sync · Email reminders</p>
    <div class="sync-bar">
      <div class="dot" id="sync-dot"></div>
      <span id="sync-label">Loading...</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="sw('form')">➕ Add/Edit</button>
    <button class="tab" onclick="sw('list')">📋 List</button>
  </div>

  <div id="tab-form" class="section visible">
    <div class="card">
      <p style="font-size:13px;font-weight:700;color:#333;margin-bottom:0.75rem;text-transform:uppercase;" id="form-lbl">New Entry</p>
      <div class="field" id="uid-row" style="display:none;">
        <label>Entry ID</label>
        <input type="text" id="f-uid" readonly style="background:#f5f7fa;color:#888;"/>
      </div>
      <div class="field"><label>Name *</label><input type="text" id="f-name" placeholder="Client name"/></div>
      <div class="row2">
        <div class="field"><label>F.Y *</label><input type="text" id="f-fy" placeholder="2024-25"/></div>
        <div class="field"><label>Notice Type *</label>
          <select id="f-notice"><option value="">Select</option><option>APPEAL</option><option>DRC-01</option><option>RECTIFICATION</option><option>ASMT-10</option></select>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Reply</label>
          <select id="f-reply"><option value="">Select</option><option>YES</option><option>NO</option><option>PENDING</option></select>
        </div>
        <div class="field"><label>Hearing Date *</label><input type="date" id="f-date"/></div>
      </div>
      <div class="field"><label>Gmail 1 — Primary *</label><input type="email" id="f-gmail1" placeholder="primary@gmail.com"/></div>
      <div class="field"><label>Gmail 2 — Secondary</label><input type="email" id="f-gmail2" placeholder="secondary@gmail.com"/></div>
      <div class="field"><label>Remark</label><textarea id="f-remark" placeholder="Optional notes..."></textarea></div>
      <div class="btn-row">
        <button class="btn btn-blue" onclick="saveEntry()">💾 Save</button>
        <button class="btn btn-gray" onclick="clearForm()" style="flex:0.45;">Clear</button>
      </div>
    </div>
  </div>

  <div id="tab-list" class="section">
    <div class="filter-row">
      <select id="fil-n" onchange="renderList()"><option value="">All types</option><option>APPEAL</option><option>DRC-01</option><option>RECTIFICATION</option><option>ASMT-10</option></select>
      <select id="fil-r" onchange="renderList()"><option value="">All replies</option><option>YES</option><option>NO</option><option>PENDING</option></select>
    </div>
    <button class="btn btn-gray" onclick="loadData()" style="margin-bottom:0.75rem;font-size:12px;padding:8px;">🔄 Refresh</button>
    <div id="list-con"><div class="empty">Loading...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const GITHUB_TOKEN = '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';
const GITHUB_OWNER = 'sahil9292-cloud';
const GITHUB_REPO  = 'hearing-tracker';
const DATA_FILE    = 'data.json';
const API = 'https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+DATA_FILE;

let entries = [];
let fileSha = '';
let editId = null;

loadData();

function sw(t){
  ['form','list'].forEach(id=>document.getElementById('tab-'+id).classList.remove('visible'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('visible');
  ['form','list'].forEach((id,i)=>{if(id===t)document.querySelectorAll('.tab')[i].classList.add('active');});
  if(t==='list') renderList();
}

function showToast(msg,color='#2e7d32'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color;t.style.color='white';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);
}

function setStatus(ok,msg){
  document.getElementById('sync-dot').className='dot'+(ok?' ok':' err');
  document.getElementById('sync-label').textContent=msg;
}

async function loadData(){
  setStatus(false,'Loading...');
  try{
    const r=await fetch(API+'?t='+Date.now(),{
      headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json'}
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const json=await r.json();
    fileSha=json.sha;
    const decoded=JSON.parse(atob(json.content.replace(/\n/g,'')));
    entries=decoded.entries||[];
    setStatus(true,'Synced ✓ — '+entries.length+' entries');
    renderList();
  }catch(e){
    setStatus(false,'Failed: '+e.message);
    showToast('Load failed — check token','#c62828');
  }
}

async function saveData(){
  const content=btoa(unescape(encodeURIComponent(JSON.stringify({entries},null,2))));
  const r=await fetch(API,{
    method:'PUT',
    headers:{'Authorization':'token '+GITHUB_TOKEN,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'Update — '+new Date().toLocaleString('en-IN'),content,sha:fileSha})
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const json=await r.json();
  fileSha=json.content.sha;
}

function genUID(){
  const ids=entries.map(e=>e.id);
  let n=entries.length+1,id='HT-'+String(n).padStart(4,'0');
  while(ids.includes(id)){n++;id='HT-'+String(n).padStart(4,'0');}
  return id;
}

async function saveEntry(){
  const name=document.getElementById('f-name').value.trim();
  const fy=document.getElementById('f-fy').value.trim();
  const notice=document.getElementById('f-notice').value;
  const reply=document.getElementById('f-reply').value;
  const date=document.getElementById('f-date').value;
  const gmail1=document.getElementById('f-gmail1').value.trim();
  const gmail2=document.getElementById('f-gmail2').value.trim();
  const remark=document.getElementById('f-remark').value.trim();
  if(!name||!notice||!date||!gmail1){showToast('Name, Notice, Date & Gmail required','#c62828');return;}
  const entry={id:editId||genUID(),name,fy,notice,reply,date,gmail1,gmail2,remark};
  const prev=[...entries];
  if(editId){const idx=entries.findIndex(e=>e.id===editId);if(idx>-1)entries[idx]=entry;}
  else entries.push(entry);
  showToast('Saving...','#1565C0');
  setStatus(false,'Saving...');
  try{
    await saveData();
    showToast(editId?'Updated ✓':'Saved! '+entry.id,'#2e7d32');
    setStatus(true,'Synced ✓ — '+entries.length+' entries');
    clearForm();renderList();
  }catch(e){
    entries=prev;
    showToast('Save failed: '+e.message,'#c62828');
    setStatus(false,'Save failed');
  }
}

function clearForm(){
  ['f-name','f-fy','f-gmail1','f-gmail2','f-remark','f-date'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-notice').value='';document.getElementById('f-reply').value='';
  editId=null;document.getElementById('form-lbl').textContent='New Entry';
  document.getElementById('uid-row').style.display='none';
}

function editEntry(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  editId=id;
  document.getElementById('f-name').value=e.name;document.getElementById('f-fy').value=e.fy;
  document.getElementById('f-notice').value=e.notice;document.getElementById('f-reply').value=e.reply;
  document.getElementById('f-date').value=e.date;document.getElementById('f-gmail1').value=e.gmail1;
  document.getElementById('f-gmail2').value=e.gmail2||'';document.getElementById('f-remark').value=e.remark||'';
  document.getElementById('f-uid').value=e.id;document.getElementById('uid-row').style.display='block';
  document.getElementById('form-lbl').textContent='Editing: '+e.name+' ('+e.id+')';
  sw('form');window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteEntry(id){
  if(!confirm('Delete '+id+'?'))return;
  const prev=[...entries];
  entries=entries.filter(e=>e.id!==id);
  setStatus(false,'Deleting...');
  try{
    await saveData();
    showToast('Deleted','#555');
    setStatus(true,'Synced ✓ — '+entries.length+' entries');
    renderList();
  }catch(e){
    entries=prev;
    showToast('Delete failed','#c62828');
    setStatus(false,'Delete failed');
  }
}

function formatDate(d){
  if(!d)return'';
  const[y,m,day]=String(d).split('-');
  return day+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(m)-1]+' '+y;
}

function renderList(){
  const fn=document.getElementById('fil-n').value;
  const fr=document.getElementById('fil-r').value;
  let f=entries.filter(e=>(!fn||e.notice===fn)&&(!fr||e.reply===fr));
  f.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const c=document.getElementById('list-con');
  if(!f.length){c.innerHTML='<div class="empty">No entries found</div>';return;}
  const today=new Date().toISOString().split('T')[0];
  const tomorrow=new Date(Date.now()+86400000).toISOString().split('T')[0];
  c.innerHTML=f.map(e=>{
    const d=String(e.date);
    const isToday=d===today,isTomorrow=d===tomorrow,isPast=d<today;
    const cls=isToday?'today':isPast?'past':'';
    const rb=e.reply==='YES'?'<span class="badge b-green">✓ Replied</span>':e.reply==='NO'?'<span class="badge b-red">✗ No reply</span>':e.reply==='PENDING'?'<span class="badge b-orange">⏳ Pending</span>':'';
    const db=isToday?'<span class="badge b-today">🔴 TODAY</span>':isTomorrow?'<span class="badge b-tomorrow">🟠 TOMORROW</span>':'';
    return `<div class="entry-card ${cls}">
      <div class="ec-top"><div class="ec-name">${e.name}</div><span class="uid-badge">${e.id}</span></div>
      <div class="ec-meta">${e.fy?e.fy+' | ':''}📅 ${formatDate(e.date)}</div>
      <div><span class="badge b-blue">${e.notice}</span>${rb}${db}</div>
      <div class="ec-gmail">📧 ${e.gmail1}${e.gmail2?' | '+e.gmail2:''}</div>
      ${e.remark?'<div style="font-size:11px;color:#777;margin-top:3px;">'+e.remark+'</div>':''}
      <div class="ec-actions">
        <button class="ec-btn" onclick="editEntry('${e.id}')">✏️ Edit</button>
        <button class="ec-btn del" onclick="deleteEntry('${e.id}')">🗑️ Delete</button>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
